<!DOCTYPE html>
<html>

<head>
    <title>Test Gemini API</title>
</head>

<body>
    <h1>Testing Gemini API</h1>
    <input type="text" id="apiKey" placeholder="Paste your Gemini API key here" style="width: 500px; padding: 8px;">
    <button onclick="listModels()">List Available Models</button>
    <button onclick="testAPI()">Test API</button>
    <pre id="result"></pre>

    <script>
        async function listModels() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const result = document.getElementById('result');

            if (!apiKey) {
                result.textContent = 'Please enter an API key';
                return;
            }

            result.textContent = 'Fetching models...';

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`
                );

                const data = await response.json();

                if (response.ok) {
                    const models = data.models.filter(m => m.supportedGenerationMethods?.includes('generateContent'));
                    result.textContent = 'Available models for generateContent:\n\n' +
                        models.map(m => m.name).join('\n');
                } else {
                    result.textContent = `Error ${response.status}:\n` + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                result.textContent = 'Error: ' + error.message;
            }
        }

        async function testAPI() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const result = document.getElementById('result');

            if (!apiKey) {
                result.textContent = 'Please enter an API key';
                return;
            }

            result.textContent = 'Testing...';

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: 'Say hello in 5 words' }]
                            }]
                        })
                    }
                );

                const data = await response.json();
                result.textContent = JSON.stringify(data, null, 2);

                if (!response.ok) {
                    result.textContent = `Error ${response.status}:\n` + result.textContent;
                }
            } catch (error) {
                result.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>

</html>
